<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册 - 沃华医药</title>
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        /* Auth Page - Dark Glassmorphism Background */
        body {
            background: var(--color-bg, #030712);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.04) 0%, transparent 60%);
            min-height: 100vh;
            margin: 0;
        }

        /* Glass Container */
        .container {
            background: rgba(15, 23, 42, 0.5);
            border-radius: var(--radius-xl, 1.5rem);
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 60px rgba(99, 102, 241, 0.05);
            max-width: 520px;
            margin: 60px auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.4), transparent);
        }

        /* Auth Header Override */
        .header {
            border-bottom: none;
            padding-bottom: 0;
        }

        .header::after {
            display: none;
        }

        .logo {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #818CF8 0%, #6366F1 50%, #A78BFA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--color-text-muted, #64748B);
            font-size: 0.9rem;
        }

        /* Tab Container - Pill Style */
        .tab-container {
            display: flex;
            background: rgba(17, 24, 39, 0.8);
            border-radius: var(--radius-lg, 1rem);
            margin-bottom: var(--spacing-lg, 1.5rem);
            padding: 4px;
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-muted, #64748B);
            border-radius: var(--radius-md, 0.75rem);
            transition: all var(--transition-base, 250ms cubic-bezier(0.4, 0, 0.2, 1));
        }

        .tab-btn:hover {
            color: var(--color-text-secondary, #CBD5E1);
        }

        .tab-btn.active {
            color: #fff;
            background: var(--color-primary, #6366F1);
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.2);
            font-weight: 600;
        }

        /* Auth Form */
        .auth-container {
            display: flex;
            gap: var(--spacing-lg, 1.5rem);
            align-items: flex-start;
        }

        .auth-form {
            flex: 1;
            min-width: 0;
        }

        .form-group {
            margin-bottom: var(--spacing-md, 1rem);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm, 0.5rem);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--color-text-secondary, #CBD5E1);
            letter-spacing: 0.01em;
        }

        .form-input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--color-border, #334155);
            border-radius: var(--radius-md, 0.75rem);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all var(--transition-base, 250ms ease);
            box-sizing: border-box;
            background: rgba(17, 24, 39, 0.6);
            color: var(--color-text, #F1F5F9);
        }

        .form-input::placeholder {
            color: var(--color-text-muted, #64748B);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary, #6366F1);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12), 0 0 16px rgba(99, 102, 241, 0.1);
            background: rgba(30, 41, 59, 0.6);
        }

        /* Login Type Switch - Pill Toggle */
        .login-type-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-lg, 1.5rem);
            gap: 4px;
            background: rgba(17, 24, 39, 0.8);
            padding: 4px;
            border-radius: var(--radius-md, 0.75rem);
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .switch-label {
            flex: 1;
            padding: 0.5rem 0.75rem;
            background: transparent;
            color: var(--color-text-muted, #64748B);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: var(--radius-sm, 0.375rem);
            transition: all var(--transition-base, 250ms ease);
            border: none;
            text-align: center;
        }

        .switch-label:hover {
            color: var(--color-text-secondary, #CBD5E1);
            background: rgba(99, 102, 241, 0.05);
        }

        .switch-label.active {
            background: var(--color-primary, #6366F1);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.2);
        }

        .switch-label.active::after {
            display: none;
        }

        .switch-label:hover.active {
            background: var(--color-primary-hover, #818CF8);
            border-color: transparent;
        }

        /* Verification Code */
        .verification-code-group {
            display: flex;
            gap: var(--spacing-sm, 0.5rem);
        }

        .verification-code-group input {
            flex: 1;
            min-width: 150px;
            text-align: center;
            letter-spacing: 8px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .send-code-btn {
            padding: 0.5rem 1rem;
            background: rgba(30, 41, 59, 0.8);
            color: var(--color-primary, #6366F1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius-md, 0.75rem);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all var(--transition-fast, 150ms ease);
            white-space: nowrap;
        }

        .send-code-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
        }

        .send-code-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
        }

        .countdown {
            font-size: 0.8rem;
            color: var(--color-text-muted, #64748B);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.08);
            color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: var(--spacing-sm, 0.5rem) var(--spacing-md, 1rem);
            border-radius: var(--radius-md, 0.75rem);
            margin-bottom: var(--spacing-md, 1rem);
            display: none;
            font-size: 0.85rem;
        }

        .error-message.show {
            display: block;
        }

        .optional-field {
            font-size: 0.75rem;
            color: var(--color-text-muted, #64748B);
            margin-top: var(--spacing-xs, 0.25rem);
        }

        .back-to-home {
            text-align: center;
            margin-top: var(--spacing-xl, 2rem);
        }

        .back-to-home a {
            color: var(--color-text-muted, #64748B);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color var(--transition-fast, 150ms ease);
        }

        .back-to-home a:hover {
            color: var(--color-primary, #6366F1);
        }

        /* Button Override */
        .btn-primary {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            border-radius: var(--radius-md, 0.75rem);
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #818CF8 0%, #6366F1 100%);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px auto;
                padding: 24px;
                max-width: 100%;
                border-radius: var(--radius-lg, 1rem);
            }

            .auth-container {
                flex-direction: column;
            }

            .auth-form {
                min-width: auto;
            }

            .verification-code-group {
                flex-direction: column;
            }

            .verification-code-group input {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <header class="header">
                <h1 class="logo">DeepResearchBot</h1>
                <p class="subtitle">员工认证</p>
            </header>

            <main class="main">
                <!-- 标签页切换 -->
                <div class="tab-container">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>

                <!-- 错误消息提示 -->
                <div id="error-message" class="error-message"></div>

                <!-- 登录表单 -->
                <div id="login-form" class="auth-form">

                    <!-- 登录方式切换 -->
                    <div class="login-type-switch">
                        <button type="button" class="switch-label active" id="switch-password">
                            密码登录
                        </button>
                        <button type="button" class="switch-label" id="switch-code">
                            验证码登录
                        </button>
                    </div>

                    <!-- 密码登录表单 -->
                    <form id="password-login-form">
                        <div class="form-group">
                            <label class="form-label" for="login-email">邮箱</label>
                            <input type="email" id="login-email" class="form-input" placeholder="请输入企业邮箱" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="login-password">密码</label>
                            <input type="password" id="login-password" class="form-input" placeholder="请输入密码" required>
                        </div>

                        <button type="submit" id="login-submit-btn" class="btn-primary">登录</button>
                    </form>

                    <!-- 验证码登录表单 -->
                    <form id="code-login-form" style="display: none;">
                        <div class="form-group">
                            <label class="form-label" for="login-code-email">邮箱</label>
                            <input type="email" id="login-code-email" class="form-input" placeholder="请输入企业邮箱" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="verification-code-input">验证码</label>
                            <div class="verification-code-group">
                                <input type="text" id="verification-code-input" class="verification-code-group input" placeholder="6位验证码" maxlength="6" required>
                                <button type="button" id="send-code-btn" class="send-code-btn">发送验证码</button>
                            </div>
                            <span id="countdown" class="countdown"></span>
                        </div>

                        <button type="submit" id="code-login-submit-btn" class="btn-primary">登录</button>
                    </form>


                </div>

                <!-- 注册表单 -->
                <div id="register-form" class="auth-form" style="display: none;">

                    <form id="register-form-element">
                        <div class="form-group">
                            <label class="form-label" for="register-email">邮箱 <span class="optional-field">*</span></label>
                            <input type="email" id="register-email" class="form-input" placeholder="请输入企业邮箱" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-password">密码 <span class="optional-field">*</span></label>
                            <input type="password" id="register-password" class="form-input" placeholder="请输入密码（至少6位）" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-confirm-password">确认密码 <span class="optional-field">*</span></label>
                            <input type="password" id="register-confirm-password" class="form-input" placeholder="请再次输入密码" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-name">姓名</label>
                            <input type="text" id="register-name" class="form-input" placeholder="请输入姓名">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-department">部门</label>
                            <input type="text" id="register-department" class="form-input" placeholder="请输入部门">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-phone">手机号</label>
                            <input type="text" id="register-phone" class="form-input" placeholder="请输入手机号">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-employee-id">员工工号</label>
                            <input type="text" id="register-employee-id" class="form-input" placeholder="请输入员工工号">
                        </div>

                        <button type="submit" id="register-submit-btn" class="btn-primary">注册</button>
                    </form>

                    <div style="margin-top: var(--spacing-lg); text-align: center;">
                        <a href="/ui/index.html" style="color: var(--color-secondary); text-decoration: none;">
                            已有账号？点击登录
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/assets/js/websocket.js"></script>
    <script src="/assets/js/auth.js"></script>
</body>
</html>
