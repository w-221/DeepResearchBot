<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册 - 沃华医药</title>
    <link rel="stylesheet" href="/ui/css/reset.css">
    <link rel="stylesheet" href="/ui/css/variables.css">
    <link rel="stylesheet" href="/ui/css/style.css">
    <style>
        /* 页面背景 */
        body {
            background: url('/ui/assets/background.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        }

        /* 主内容区域添加半透明背景，提高可读性 */
        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            max-width: 800px;
            margin: 40px auto;
            backdrop-filter: blur(10px);
        }

        /* 额外的内联样式 */
        .tab-container {
            display: flex;
            background: var(--color-bg-alt);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-sm);
        }

        .tab-btn {
            flex: 1;
            padding: var(--spacing-md);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            color: var(--color-text-muted);
            border-bottom: 3px solid transparent;
            transition: all var(--transition-base);
        }

        .tab-btn:hover {
            color: var(--color-primary);
        }

        .tab-btn.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
            font-weight: 600;
        }

        .auth-container {
            display: flex;
            gap: var(--spacing-lg);
            align-items: flex-start;
        }

        .auth-form {
            flex: 1;
            min-width: 350px;
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            color: var(--color-text);
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color var(--transition-base);
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .login-type-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
            gap: var(--spacing-sm);
            background: var(--color-bg-alt);
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
        }

        .switch-label {
            flex: 1;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 2px solid var(--color-primary);
            background: var(--color-primary);
            color: white;
            cursor: pointer;
            font-size: 0.95rem;
            border-radius: var(--radius-sm);
            transition: all var(--transition-base);
            position: relative;
            min-width: 100px;
            justify-content: center;
            align-items: center;
        }

        .switch-label:hover {
            border-color: var(--color-primary);
            background: var(--color-bg-alt);
            transform: translateY(-1px);
        }

        .switch-label.active {
            background: white;
            color: var(--color-primary);
            border-color: var(--color-primary);
            font-weight: 400;
        }

        .switch-label.active::after {
            display: none;
        }

        .switch-label:hover.active {
            border-color: var(--color-primary);
        }

        .verification-code-group {
            display: flex;
            gap: var(--spacing-sm);
        }

        .verification-code-group input {
            flex: 1;
        min-width: 150px;
        text-align: center;
            letter-spacing: 8px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .send-code-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-secondary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color var(--transition-fast);
        }

        .send-code-btn:hover {
            background: var(--color-secondary-hover);
        }

        .send-code-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .countdown {
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            margin-bottom: var(--spacing-md);
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .optional-field {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-top: var(--spacing-xs);
        }

        .back-to-home {
            text-align: center;
            margin-top: var(--spacing-xl);
        }

        .back-to-home a {
            color: var(--color-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color var(--transition-fast);
        }

        .back-to-home a:hover {
            color: var(--color-primary);
        }

        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
            }

            .auth-form {
                min-width: auto;
            }

            .verification-code-group {
                flex-direction: column;
            }

            .verification-code-group input {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <header class="header">
                <h1 class="logo">DeepResearchBot</h1>
                <p class="subtitle">员工认证</p>
            </header>

            <main class="main">
                <!-- 标签页切换 -->
                <div class="tab-container">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>

                <!-- 错误消息提示 -->
                <div id="error-message" class="error-message"></div>

                <!-- 登录表单 -->
                <div id="login-form" class="auth-form">

                    <!-- 登录方式切换 -->
                    <div class="login-type-switch">
                        <button type="button" class="switch-label active" id="switch-password">
                            密码登录
                        </button>
                        <button type="button" class="switch-label" id="switch-code">
                            验证码登录
                        </button>
                    </div>

                    <!-- 密码登录表单 -->
                    <form id="password-login-form">
                        <div class="form-group">
                            <label class="form-label" for="login-email">邮箱</label>
                            <input type="email" id="login-email" class="form-input" placeholder="请输入企业邮箱" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="login-password">密码</label>
                            <input type="password" id="login-password" class="form-input" placeholder="请输入密码" required>
                        </div>

                        <button type="submit" id="login-submit-btn" class="btn-primary">登录</button>
                    </form>

                    <!-- 验证码登录表单 -->
                    <form id="code-login-form" style="display: none;">
                        <div class="form-group">
                            <label class="form-label" for="login-code-email">邮箱</label>
                            <input type="email" id="login-code-email" class="form-input" placeholder="请输入企业邮箱" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="verification-code-input">验证码</label>
                            <div class="verification-code-group">
                                <input type="text" id="verification-code-input" class="verification-code-group input" placeholder="6位验证码" maxlength="6" required>
                                <button type="button" id="send-code-btn" class="send-code-btn">发送验证码</button>
                            </div>
                            <span id="countdown" class="countdown"></span>
                        </div>

                        <button type="submit" id="code-login-submit-btn" class="btn-primary">登录</button>
                    </form>


                </div>

                <!-- 注册表单 -->
                <div id="register-form" class="auth-form" style="display: none;">

                    <form id="register-form-element">
                        <div class="form-group">
                            <label class="form-label" for="register-email">邮箱 <span class="optional-field">*</span></label>
                            <input type="email" id="register-email" class="form-input" placeholder="请输入企业邮箱" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-password">密码 <span class="optional-field">*</span></label>
                            <input type="password" id="register-password" class="form-input" placeholder="请输入密码（至少6位）" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-confirm-password">确认密码 <span class="optional-field">*</span></label>
                            <input type="password" id="register-confirm-password" class="form-input" placeholder="请再次输入密码" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-name">姓名</label>
                            <input type="text" id="register-name" class="form-input" placeholder="请输入姓名">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-department">部门</label>
                            <input type="text" id="register-department" class="form-input" placeholder="请输入部门">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-phone">手机号</label>
                            <input type="text" id="register-phone" class="form-input" placeholder="请输入手机号">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="register-employee-id">员工工号</label>
                            <input type="text" id="register-employee-id" class="form-input" placeholder="请输入员工工号">
                        </div>

                        <button type="submit" id="register-submit-btn" class="btn-primary">注册</button>
                    </form>

                    <div style="margin-top: var(--spacing-lg); text-align: center;">
                        <a href="/ui/index.html" style="color: var(--color-secondary); text-decoration: none;">
                            已有账号？点击登录
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/ui/js/websocket.js"></script>
    <script src="/ui/js/auth.js"></script>
</body>
</html>
